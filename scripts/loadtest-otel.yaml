# In-cluster ClickStack OTel collector used only by the kind loadtests
# (scripts/kind-*-loadtest.sh) as the OTLP sink for the engine's OpenTelemetry export.
# The engine is pointed at svc `otel-collector:4317` (in-cluster, plaintext); the
# collector holds the ClickHouse Cloud credentials and ships spans there over TLS.
# Credentials come from the `clickstack-otel` Secret the scripts create from GitHub
# secrets. The cluster is torn down after every run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: clickhouse/clickstack-otel-collector:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: clickstack-otel
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
