# Throwaway Jaeger all-in-one used only by the kind loadtests (hack/kind-*-loadtest.sh)
# as an in-cluster OTLP sink for the engine's OpenTelemetry export. The engine is
# pointed at svc `jaeger:4317` via `--set sharedConfig.env.SERVER_OTEL_COLLECTOR_URL`.
# After a run the scripts export the collected traces (Jaeger JSON) as a CI artifact.
# In-memory storage only — the cluster is torn down after every run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: query
              containerPort: 16686
            - name: admin
              containerPort: 14269
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: query
      port: 16686
      targetPort: 16686
