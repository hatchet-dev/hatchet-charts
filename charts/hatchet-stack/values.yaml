global:
  # Name of the Secret rendered from sharedConfig and loaded by every backend
  # component via envFrom. Kept as "hatchet-shared-config" for backwards
  # compatibility. Set it to a release-scoped value (the string is passed
  # through `tpl`, so `{{ .Release.Name }}-shared-config` works) to run
  # multiple releases in the same namespace without a name collision.
  sharedConfigSecretName: hatchet-shared-config

# sharedConfig is inherited by all backend services: api, grpc, controllers, scheduler
sharedConfig:
  # you can disable shared config by setting this to false
  enabled: true

  # if set, this image tag will be used for all Hatchet components (api, engine, frontend)
  # individual component image.tag values will be used as fallbacks if this is not set
  image:
    tag: "v0.94.10"

  # these are the most commonly configured values
  serverUrl: "http://localhost:8080"
  serverAuthCookieDomain: "localhost:8080" # the domain for the auth cookie
  serverAuthCookieInsecure: "t" # allows cookies to be set over http
  serverAuthSetEmailVerified: "t" # automatically sets email_verified to true for all users
  serverAuthBasicAuthEnabled: "t" # allows login via basic auth (email/password)
  grpcBroadcastAddress: "localhost:7070" # the endpoint for the gRPC server, exposed via the `grpc` service
  grpcInsecure: "t" # allows gRPC to be served over http
  defaultAdminEmail: "admin@example.com" # in exposed/production environments, change this to a valid email
  defaultAdminPassword: "Admin123!!" # in exposed/production environments, change this to a secure password

  # you can set additional environment variables here, which will override any defaults
  env: {}

api:
  enabled: true
  replicaCount: 2
  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-api"
    tag: "v0.94.10"
    pullPolicy: "IfNotPresent"
  # Retain failed Helm hook Jobs (currently the pre-upgrade migration hook) so logs survive for debugging.
  retainFailedHooks: true
  migrationJob:
    enabled: true
    # Number of retries before the migration Job is marked failed.
    backoffLimit: 1
    # Hard timeout (seconds) for the migration Job; raise for long-running schema changes.
    activeDeadlineSeconds: 900
    image:
      repository: "ghcr.io/hatchet-dev/hatchet/hatchet-migrate"
      tag: "v0.94.10"
      pullPolicy: "IfNotPresent"
  serviceAccount:
    create: true
    name: hatchet-api
  envFrom:
    - secretRef:
        name: '{{ tpl .Values.global.sharedConfigSecretName . }}'
  ingress:
    enabled: false
  health:
    enabled: true
    spec:
      livenessProbe:
        httpGet:
          path: /api/live
          port: 8080
        periodSeconds: 5
        initialDelaySeconds: 60
      readinessProbe:
        httpGet:
          path: /api/ready
          port: 8080
        periodSeconds: 5
        initialDelaySeconds: 20

engine:
  enabled: true
  nameOverride: engine
  replicaCount: 1
  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-engine"
    tag: "v0.94.10"
    pullPolicy: "IfNotPresent"
  setupJob:
    enabled: false
  migrationJob:
    enabled: false
  service:
    externalPort: 7070
    internalPort: 7070
  commandline:
    command: ["/hatchet/hatchet-engine"]
  deployment:
    annotations:
      app.kubernetes.io/name: hatchet-engine
  serviceAccount:
    create: true
    name: hatchet-engine
  envFrom:
    - secretRef:
        name: '{{ tpl .Values.global.sharedConfigSecretName . }}'
  ingress:
    enabled: false
  health:
    enabled: true
    spec:
      livenessProbe:
        httpGet:
          path: /live
          port: 8733
        periodSeconds: 5
        initialDelaySeconds: 60
      readinessProbe:
        httpGet:
          path: /ready
          port: 8733
        periodSeconds: 5
        initialDelaySeconds: 20

frontend:
  enabled: true
  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-frontend"
    tag: "v0.94.10"
    pullPolicy: "IfNotPresent"
  service:
    externalPort: 8080
    internalPort: 80
  ingress:
    enabled: false

postgres:
  # The bundled PostgreSQL is a CloudNativePG (CNPG) Cluster, for development/staging
  # only. It requires the CloudNativePG operator to be installed in the cluster
  # (see hack/install-operators.sh). For production, set enabled: false and point
  # DATABASE_URL at a database you operate yourself (managed service or self-hosted
  # with backups, HA and monitoring).
  enabled: true
  auth:
    username: "hatchet"
    password: "hatchet"
    database: "hatchet"
  # CNPG-flavoured PostgreSQL image. Pinned to the PostgreSQL 17 line.
  image: "ghcr.io/cloudnative-pg/postgresql:17.6"
  # Number of PostgreSQL instances (1 = single primary, no replicas).
  instances: 1
  storage:
    size: "8Gi"
    storageClass: ""
  resources: {}
  # Port the CNPG read-write service listens on.
  port: 5432
  # sslmode used in DATABASE_URL. CNPG always serves TLS, so "require" works
  # in-cluster without CA verification.
  sslmode: "require"
  # Extra postgresql.conf parameters merged into the Cluster (timezone=UTC is
  # always forced by the template because Hatchet requires it).
  parameters: {}
  # SQL run once, as superuser, in the application database after bootstrap.
  # e.g. ["CREATE EXTENSION IF NOT EXISTS pgcrypto;"]
  initExtensions: []

rabbitmq:
  # The bundled RabbitMQ is a RabbitMQ Cluster Operator RabbitmqCluster, for
  # development/staging only. It requires the RabbitMQ Cluster Operator to be
  # installed in the cluster (see hack/install-operators.sh). The chart pre-creates
  # the operator's default-user Secret with these credentials, so the broker uses
  # them and SERVER_MSGQUEUE_RABBITMQ_URL is composed from them. For production, set
  # enabled: false and point SERVER_MSGQUEUE_RABBITMQ_URL at a broker you operate
  # yourself.
  enabled: true
  auth:
    username: "hatchet"
    password: "hatchet"
  image: "rabbitmq:4.1-management"
  replicas: 1
  # Port the RabbitmqCluster AMQP service listens on.
  port: 5672
  persistence:
    storage: "8Gi"
    storageClassName: ""
  resources: {}

caddy:
  enabled: false
  image:
    repository: "caddy"
    tag: "2.7.6-alpine"
    pullPolicy: "IfNotPresent"
