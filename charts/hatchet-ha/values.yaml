global:
  # Name of the Secret rendered from sharedConfig and loaded by every backend
  # component via envFrom. Kept as "hatchet-shared-config" for backwards
  # compatibility. Set it to a release-scoped value (the string is passed
  # through `tpl`, so `{{ .Release.Name }}-shared-config` works) to run
  # multiple releases in the same namespace without a name collision.
  sharedConfigSecretName: hatchet-shared-config

# sharedConfig is inherited by all backend services: api, grpc, controllers, scheduler
sharedConfig:
  # you can disable shared config by setting this to false
  enabled: true

  # if set, this image tag will be used for all Hatchet components (api, grpc, controllers, scheduler, frontend)
  # individual component image.tag values will be used as fallbacks if this is not set
  image:
    tag: "v0.94.10"

  # these are the most commonly configured values
  serverUrl: "http://localhost:8080"
  serverAuthCookieDomain: "localhost:8080" # the domain for the auth cookie
  serverAuthCookieInsecure: "t" # allows cookies to be set over http
  serverAuthSetEmailVerified: "t" # automatically sets email_verified to true for all users
  serverAuthBasicAuthEnabled: "t" # allows login via basic auth (email/password)
  grpcBroadcastAddress: "localhost:7070" # the endpoint for the gRPC server, exposed via the `grpc` service
  grpcInsecure: "t" # allows gRPC to be served over http
  defaultAdminEmail: "admin@example.com" # in exposed/production environments, change this to a valid email
  defaultAdminPassword: "Admin123!!" # in exposed/production environments, change this to a secure password

  # you can set additional environment variables here, which will override any defaults
  env: {}

api:
  enabled: true
  replicaCount: 2
  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-api"
    tag: "v0.94.10"
    pullPolicy: "IfNotPresent"
  # Retain failed Helm hook Jobs (currently the pre-upgrade migration hook) so logs survive for debugging.
  retainFailedHooks: true
  migrationJob:
    enabled: true
    # Number of retries before the migration Job is marked failed.
    backoffLimit: 1
    # Hard timeout (seconds) for the migration Job; raise for long-running schema changes.
    activeDeadlineSeconds: 900
    image:
      repository: "ghcr.io/hatchet-dev/hatchet/hatchet-migrate"
      tag: "v0.94.10"
      pullPolicy: "IfNotPresent"
  serviceAccount:
    create: true
    name: hatchet-api
  envFrom:
    - secretRef:
        name: '{{ tpl .Values.global.sharedConfigSecretName . }}'
  ingress:
    enabled: false
  health:
    enabled: true
    spec:
      livenessProbe:
        httpGet:
          path: /api/live
          port: 8080
        periodSeconds: 5
        initialDelaySeconds: 60
      readinessProbe:
        httpGet:
          path: /api/ready
          port: 8080
        periodSeconds: 5
        initialDelaySeconds: 20

grpc:
  enabled: true
  nameOverride: hatchet-grpc
  fullnameOverride: hatchet-grpc
  replicaCount: 1
  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-engine"
    tag: "v0.94.10"
    pullPolicy: "IfNotPresent"
  setupJob:
    enabled: false
  migrationJob:
    enabled: false
  service:
    externalPort: 7070
    internalPort: 7070
  commandline:
    command: ["/hatchet/hatchet-engine"]
  deployment:
    annotations:
      app.kubernetes.io/name: hatchet-grpc
  serviceAccount:
    create: true
    name: hatchet-grpc
  env:
    SERVER_SERVICES: "grpc-api"
  envFrom:
    - secretRef:
        name: '{{ tpl .Values.global.sharedConfigSecretName . }}'
  ingress:
    enabled: false
  health:
    enabled: true
    spec:
      livenessProbe:
        httpGet:
          path: /live
          port: 8733
        periodSeconds: 5
        initialDelaySeconds: 60
      readinessProbe:
        httpGet:
          path: /ready
          port: 8733
        periodSeconds: 5
        initialDelaySeconds: 20

