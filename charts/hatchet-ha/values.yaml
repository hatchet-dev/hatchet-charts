  image:
    repository: "ghcr.io/hatchet-dev/hatchet/hatchet-frontend"
    tag: "v0.94.10"
    pullPolicy: "IfNotPresent"
  service:
    externalPort: 8080
    internalPort: 80
  ingress:
    enabled: false

postgres:
  enabled: true
  auth:
    username: "hatchet"
    password: "hatchet"
    database: "hatchet"
  image: "ghcr.io/cloudnative-pg/postgresql:17.6"
  instances: 3
  storage:
    size: "8Gi"
    storageClass: ""
  resources: {}
  port: 5432
  sslmode: "require"
  parameters: {}
  initExtensions: []

rabbitmq:
  enabled: true
  auth:
    username: "hatchet"
    password: "hatchet"
  image: "rabbitmq:4.1-management"
  replicas: 3
  port: 5672
  persistence:
    storage: "8Gi"
    storageClassName: ""
  resources: {}

caddy:
  enabled: false
  # Caddy site address: the top line of the generated Caddyfile block. The
  # default serves only requests with Host: localhost, which matches the
  # documented `kubectl port-forward` workflow. Set to ":8080" to serve any
  # Host, e.g. when fronting Caddy with an ingress, service mesh or VPN overlay
  # (Tailscale), where the request Host is not localhost.
  address: "http://localhost:8080"
  image:
    repository: "caddy"
    tag: "2.7.6-alpine"
    pullPolicy: "IfNotPresent"
  service:
    # Set to ClusterIP to front Caddy with your own ingress, service mesh or VPN
    # overlay instead of provisioning a cloud load balancer.
    type: LoadBalancer
