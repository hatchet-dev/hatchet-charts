# Values used by `ct install` (.github/workflows/lint-test.yaml) and the
# upgrade-e2e job (.github/workflows/test.yaml) for the chart in THIS PR.
# Trims the footprint so a full install fits on a single-node kind cluster:
# bundled Postgres (CloudNativePG, single instance; timezone UTC is forced by the
# template) but no RabbitMQ (Postgres-backed queue), single replicas and small
# resource requests. Requires the CloudNativePG operator (installed by CI before use).
rabbitmq:
  enabled: false
postgres:
  instances: 1
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
sharedConfig:
  env:
    SERVER_MSGQUEUE_KIND: postgres
api:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
grpc:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
controllers:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
scheduler:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
frontend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
