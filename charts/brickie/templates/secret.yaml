{{- if .Values.hatchet.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brickie.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "brickie.labels" . | nindent 4 }}
type: Opaque
stringData:
  HATCHET_CLIENT_TOKEN: {{ .Values.hatchet.token | quote }}
{{- end }}
