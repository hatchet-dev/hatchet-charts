{{- if or .Values.quickstartJob.enabled .Values.workerTokenJob.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "hatchet.bootstrap.serviceAccountName" . }}
  labels:
{{- include "hatchet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "hatchet.bootstrap.serviceAccountName" . }}
  labels:
{{- include "hatchet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "hatchet.bootstrap.serviceAccountName" . }}
  labels:
{{- include "hatchet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "hatchet.bootstrap.serviceAccountName" . }}
subjects:
- kind: ServiceAccount
  name: {{ template "hatchet.bootstrap.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "hatchet.fullname" . }}-migration
  labels:
{{- include "hatchet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": {{ include "hatchet.bootstrap.hookDeletePolicy" . }}
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrationJob.activeDeadlineSeconds }}
  template:
    metadata:
      name: {{ template "hatchet.fullname" . }}-migration
      labels:
{{- include "hatchet.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.priorityClassName }}
      priorityClassName: "{{ .Values.priorityClassName }}"
      {{- end }}
      initContainers:
{{- include "hatchet.bootstrap.checkDb" . | nindent 6 }}
      containers:
      - name: migration-job
        image: "{{ .Values.migrationJob.image.repository }}:{{ required "Please set a value for .Values.image.tag" (coalesce .Values.sharedConfig.image.tag .Values.migrationJob.image.tag) }}"
        imagePullPolicy: {{ .Values.migrationJob.image.pullPolicy }}
        env:
{{- include "hatchet.bootstrap.envItems" . | nindent 8 }}
        {{- if .Values.envFrom }}
        envFrom:
{{ tpl (toYaml .Values.envFrom) . | indent 10 }}
        {{- end }}
---
{{- end }}
{{- if .Values.seedJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "hatchet.fullname" . }}-seed
  labels:
{{- include "hatchet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": {{ include "hatchet.bootstrap.hookDeletePolicy" . }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: {{ template "hatchet.fullname" . }}-seed
      labels:
{{- include "hatchet.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      shareProcessNamespace: true
      {{- if .Values.priorityClassName }}
      priorityClassName: "{{ .Values.priorityClassName }}"
      {{- end }}
      initContainers:
{{- include "hatchet.bootstrap.checkDb" . | nindent 6 }}
      containers:
      - name: seed-job
        image: "{{ .Values.seedJob.image.repository }}:{{ required "Please set a value for .Values.image.tag" (coalesce .Values.sharedConfig.image.tag .Values.seedJob.image.tag) }}"
        imagePullPolicy: {{ .Values.seedJob.image.pullPolicy }}
        command: ["/hatchet/hatchet-admin", "quickstart", "--skip", "certs", "--skip", "keys"]
        securityContext:
          capabilities:
            add:
              - SYS_PTRACE
        env:
{{- include "hatchet.bootstrap.envItems" . | nindent 8 }}
        {{- if .Values.envFrom }}
        envFrom:
{{ tpl (toYaml .Values.envFrom) . | indent 10 }}
        {{- end }}
---
{{- end }}
{{- if .Values.quickstartJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "hatchet.fullname" . }}-quickstart
  labels:
{{- include "hatchet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": {{ include "hatchet.bootstrap.hookDeletePolicy" . }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: {{ template "hatchet.fullname" . }}-quickstart
      labels:
{{- include "hatchet.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      shareProcessNamespace: true
      serviceAccountName: {{ template "hatchet.bootstrap.serviceAccountName" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: "{{ .Values.priorityClassName }}"
      {{- end }}
      initContainers:
{{- include "hatchet.bootstrap.checkDb" . | nindent 6 }}
      containers:
      - name: setup-job
        image: "{{ .Values.setupJob.image.repository }}:{{ required "Please set a value for .Values.image.tag" (coalesce .Values.sharedConfig.image.tag .Values.setupJob.image.tag) }}"
        imagePullPolicy: {{ .Values.setupJob.image.pullPolicy }}
        # this command requires read-write access on the hatchet-config configmap
        command: ["/hatchet/hatchet-admin", "k8s", "quickstart", "--namespace", "{{ .Release.Namespace }}", "--overwrite=false"]
        securityContext:
          capabilities:
            add:
              - SYS_PTRACE
        env:
{{- include "hatchet.bootstrap.envItems" . | nindent 8 }}
        {{- if .Values.envFrom }}
        envFrom:
{{ tpl (toYaml .Values.envFrom) . | indent 10 }}
        {{- end }}
---
{{- end }}
{{- if .Values.workerTokenJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "hatchet.fullname" . }}-worker-token
  labels:
{{- include "hatchet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": {{ include "hatchet.bootstrap.hookDeletePolicy" . }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: {{ template "hatchet.fullname" . }}-worker-token
      labels:
{{- include "hatchet.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      shareProcessNamespace: true
      serviceAccountName: {{ template "hatchet.bootstrap.serviceAccountName" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: "{{ .Values.priorityClassName }}"
      {{- end }}
      initContainers:
      - name: check-db-connection
        image: "{{ .Values.postgresImage.repository }}:{{ required "Please set a value for .Values.postgresImage.tag" .Values.postgresImage.tag }}"
        imagePullPolicy: {{ .Values.postgresImage.pullPolicy }}
        command: ['sh','-lc']
        args:
          - |
            until pg_isready -q -t 5 -d "$DATABASE_URL"; do
              echo "waiting for database"; sleep 2
            done
        env:
{{- include "hatchet.bootstrap.envItems" . | nindent 8 }}
        envFrom:
{{ tpl (toYaml .Values.deploymentEnvFrom) . | nindent 10 }}
{{- if .Values.envFrom }}
{{ tpl (toYaml .Values.envFrom) . | nindent 10 }}
{{- end }}
      containers:
      - name: setup-worker-token
        image: "{{ .Values.setupJob.image.repository }}:{{ required "Please set a value for .Values.image.tag" (coalesce .Values.sharedConfig.image.tag .Values.setupJob.image.tag) }}"
        imagePullPolicy: {{ .Values.setupJob.image.pullPolicy }}
        # this command requires read-write access on the hatchet-config configmap
        command: ["/hatchet/hatchet-admin", "k8s", "create-worker-token", "--namespace", "{{ .Release.Namespace }}"]
        securityContext:
          capabilities:
            add:
              - SYS_PTRACE
        env:
{{- include "hatchet.bootstrap.envItems" . | nindent 8 }}
        envFrom:
{{ tpl (toYaml .Values.deploymentEnvFrom) . | nindent 10 }}
{{- if .Values.envFrom }}
{{ tpl (toYaml .Values.envFrom) . | nindent 10 }}
{{- end }}
{{- end }}
